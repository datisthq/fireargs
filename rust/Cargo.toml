[package]
name = "fireargs"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Build CLIs from serde structs: typed input and output, JSON I/O and LLM-ready manifests"
license = "MIT"
authors = ["Evgeny Karev"]
repository = "https://github.com/datisthq/fireargs"
homepage = "https://fireargs.dev/rust/introduction/"
readme = "README.md"
keywords = ["cli", "clap", "llm", "mcp", "serde"]
categories = ["command-line-interface"]
include = ["src/**/*.rs", "skills/**/*.md", "README.md", "LICENSE.md"]

[[test]]
name = "conformance"
harness = false

[workspace]
members = ["macros"]

[dependencies]
fireargs-macros = { version = "0.3.0", path = "macros" }
clap = { version = "4.6.7", features = ["env", "string"] }
jsonschema = { version = "0.58.6", default-features = false }
pollster = "1.0.1"
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

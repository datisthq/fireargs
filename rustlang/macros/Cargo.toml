[package]
name = "fireargs-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The attribute macros of fireargs: #[fireargs::input], #[fireargs::output] and #[fireargs::value]"
license = "MIT"
authors = ["Evgeny Karev"]
repository = "https://github.com/datisthq/fireargs"
homepage = "https://fireargs.dev/rust/introduction/"
keywords = ["cli", "clap", "llm", "mcp", "serde"]
categories = ["command-line-interface"]
include = ["src/**/*.rs"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.104", features = ["full"] }

[lints]
workspace = true

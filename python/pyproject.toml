[project]
name = "fireargs"
version = "0.1.0"
description = "Build CLIs from pydantic models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
keywords = ["cli", "click", "fireargs", "llm", "mcp", "pydantic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["click>=8.2", "pydantic>=2.12", "typing-extensions>=4.12"]

[[project.authors]]
name = "Evgeny Karev"

[project.urls]
homepage = "https://fireargs.dev/python/introduction/"
repository = "https://github.com/datisthq/fireargs"

[dependency-groups]
dev = [
  "jsonschema>=4.25",
  "pytest==9.0.2",
  "pytest-cov>=7.0.0",
  "ruff==0.15.0",
  "ty==0.0.87",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fireargs"]
exclude = ["**/*_unit.py", "fireargs/_test"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "fireargs/skills"

[tool.hatch.build.targets.sdist]
include = ["fireargs", "skills", "README.md", "LICENSE.md"]
exclude = ["**/*_unit.py", "fireargs/_test"]

[tool.uv]
# Same seven-day quarantine as minimumReleaseAge in pnpm-workspace.yaml; pin a hotfix
# through exclude-newer-package instead of shortening this for the whole tree
exclude-newer = "7 days"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
python_files = ["*_unit.py"]
testpaths = ["fireargs"]
filterwarnings = ["error::UserWarning"]

[tool.coverage.run]
source = ["fireargs"]
omit = ["*/_test/*", "*_unit.py"]

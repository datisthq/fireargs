pre-commit:
  jobs:
    - name: format
      exclude: ["**/*.py", "**/*.rs"]
      run: pnpm exec vp fmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format-python
      root: python/
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    - name: format-rust
      root: rustlang/
      glob: "*.rs"
      run: cargo fmt -- {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: test
      run: pnpm test
